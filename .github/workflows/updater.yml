name: Updater

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/updater.yml'
      - 'updater.py'
  pull_request:
    paths:
      - '.github/workflows/updater.yml'
      - 'updater.py'

jobs:

  updater:
    name: Updater
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v6

      - run: python3 updater.py
